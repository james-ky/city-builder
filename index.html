<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Builder</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b2430;touch-action:none;font-family:system-ui,sans-serif}#hud{position:fixed;top:56px;left:10px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}#toolbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.6);padding:6px;border-radius:10px}#toolbar button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:8px 10px;font-size:14px;cursor:pointer}#toolbar button b{color:#9cf;margin-right:4px}#toolbar button.on{background:#3d6fd1;border-color:#9cf}#help{position:fixed;top:56px;right:10px;color:#ddd;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5;pointer-events:none}#stats{position:fixed;z-index:10;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(10,14,20,.85);color:#eee;font-size:13px;white-space:nowrap;overflow:hidden}#nums{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}#nums .it{margin-right:10px}.grp{display:flex;gap:3px;padding-left:8px;border-left:1px solid #3a4454}#stats button{white-space:nowrap}#musicBtn:not(.on){text-decoration:line-through;opacity:.7}.sec{margin-bottom:6px}.sec b{display:block;color:#9cf;font-size:12px}#stats b{color:#fff}#speed button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;margin-right:3px;padding:4px 8px;cursor:pointer}#speed button.on{background:#3d6fd1}#rci{display:flex;gap:4px;margin-left:auto}.rci{display:flex;flex-direction:column;align-items:center;width:20px;font-size:11px;font-weight:bold}.half{height:17px;width:14px;background:#222a35;display:flex;flex-direction:column;justify-content:flex-end}.half.neg{justify-content:flex-start;border-top:1px solid #888}#info{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5}#fxBtn,#ambBtn,#musicBtn,#zoneBtn,#gridBtn{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;padding:4px 8px;cursor:pointer}#ambBtn.on,#musicBtn.on,#zoneBtn.on,#gridBtn.on{background:#3d6fd1}#vol,#ambVol{width:60px}#credit{display:none;position:fixed;right:10px;bottom:10px;color:#ccc;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:6px;font-size:11px;max-width:40vw}#credit a{color:#9cf}#fxMenu{display:none;position:fixed;top:46px;right:80px;background:rgba(10,14,20,.92);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.9;z-index:5}#fxMenu label{display:block;cursor:pointer}#services{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:10px;color:#ddd;font-size:12px;white-space:nowrap}#services button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer}#services button.on{background:#3d6fd1;border-color:#9cf}#services small{color:#9cf}#services button img{width:20px;height:20px;vertical-align:middle;margin-right:4px}#services button{display:flex;align-items:center}#services select{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:4px}</style></head>
<body><div id="stats"><span id="nums"></span><span id="speed"><button data-s="0" title="Pause (Space)">⏸</button><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="3">3×</button></span><span class="grp" id="viewGrp"><button id="zoneBtn" title="Zone colors (Z)">◧</button><button id="gridBtn" title="Grid (G)">▦</button></span><span class="grp"><button id="musicBtn" title="Music on/off">♪</button><button id="fxBtn" title="Settings: audio &amp; effects">⚙</button></span><div id="fxMenu"><div class="sec"><b>Audio</b><label>Music volume <input id="vol" type="range" min="0" max="1" step="0.05"></label><label><button id="ambBtn" title="City ambience on/off">🏙 Off</button> <input id="ambVol" type="range" min="0" max="1" step="0.05" title="Ambience volume"></label></div><div class="sec"><b>Effects</b><div id="fxList"></div></div></div><span id="rci"></span></div><div id="info"></div><div id="hud">Tile: —</div><div id="services"></div><div id="toolbar"></div><div id="credit"></div><div id="help">1–6 pick tool · Esc cancel<br>WASD/arrows pan · wheel or Q/E zoom<br>Drag: pans in Select, builds otherwise<br>Space pause · G grid · Z zones · ⚙ effects · click building for info</div><script type="module" src="/src/main.ts"></script></body></html>
