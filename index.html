<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Builder</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b2430;touch-action:none;font-family:system-ui,sans-serif}#hud{position:fixed;top:64px;left:10px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}#toolbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.6);padding:6px;border-radius:10px}#toolbar button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:8px 10px;font-size:14px;cursor:pointer}#toolbar button b{color:#9cf;margin-right:4px}#toolbar button.on{background:#3d6fd1;border-color:#9cf}#help{position:fixed;top:64px;right:10px;color:#ddd;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5;pointer-events:none}#stats{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(10,14,20,.8);color:#eee;font-size:14px}#stats b{color:#fff}#speed button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;margin-right:3px;padding:4px 8px;cursor:pointer}#speed button.on{background:#3d6fd1}#rci{display:flex;gap:4px;margin-left:auto}.rci{display:flex;flex-direction:column;align-items:center;width:20px;font-size:11px;font-weight:bold}.half{height:20px;width:14px;background:#222a35;display:flex;flex-direction:column;justify-content:flex-end}.half.neg{justify-content:flex-start;border-top:1px solid #888}#info{display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5}#fxBtn,#musicBtn,#zoneBtn,#gridBtn{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;padding:4px 8px;cursor:pointer}#musicBtn.on,#zoneBtn.on,#gridBtn.on{background:#3d6fd1}#vol{width:70px}#fxMenu{display:none;position:fixed;top:52px;right:90px;background:rgba(10,14,20,.92);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.9;z-index:5}#fxMenu label{display:block;cursor:pointer}</style></head>
<body><div id="stats"><span id="nums"></span><span id="speed"><button data-s="0">⏸</button><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="3">3×</button></span><button id="zoneBtn" title="Toggle zone colors (Z)">◧ Zones</button><button id="gridBtn" title="Toggle grid (G)">▦ Grid</button><button id="musicBtn" title="Music on/off">♪ Music</button><input id="vol" type="range" min="0" max="1" step="0.05" title="Volume"><button id="fxBtn" title="Effects settings">⚙</button><div id="fxMenu"></div><span id="rci"></span></div><div id="info"></div><div id="hud">Tile: —</div><div id="toolbar"></div><div id="help">1–6 pick tool · Esc cancel<br>WASD/arrows pan · wheel or Q/E zoom<br>Drag: pans in Select, builds otherwise<br>Space pause · G grid · Z zones · ⚙ effects · click building for info</div><script type="module" src="/src/main.ts"></script></body></html>
