<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Builder</title>
<style>.ic{width:18px;height:18px;vertical-align:-4px;display:inline-block}html,body{margin:0;height:100%;overflow:hidden;background:#1b2430;touch-action:none;font-family:system-ui,sans-serif}#hud{position:fixed;top:56px;left:10px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}#toolbar{position:fixed;bottom:12px;left:0;right:0;margin:0 auto;width:max-content;max-width:96vw;display:flex;gap:6px;background:rgba(0,0,0,.6);padding:6px;border-radius:10px}#toolbar button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:8px 10px;font-size:14px;cursor:pointer}#toolbar button b{color:#9cf;margin-right:4px}#toolbar button.on{background:#3d6fd1;border-color:#9cf}#help{position:fixed;top:56px;right:10px;color:#ddd;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.5;pointer-events:none}#stats{position:fixed;z-index:10;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(10,14,20,.85);color:#eee;font-size:13px;white-space:nowrap;overflow:hidden}#nums{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}#nums .it{margin-right:10px}.grp{display:flex;gap:3px;padding-left:8px;border-left:1px solid #3a4454}#stats button{white-space:nowrap}#musicBtn:not(.on){text-decoration:line-through;opacity:.7}.sec{margin-bottom:6px}.sec b{display:block;color:#9cf;font-size:12px}#stats b{color:#fff}#speed button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;margin-right:3px;padding:4px 8px;cursor:pointer}#speed button.on{background:#3d6fd1}#rci{display:flex;gap:4px;margin-left:auto}.rci{display:flex;flex-direction:column;align-items:center;width:20px;font-size:11px;font-weight:bold}.half{height:17px;width:14px;background:#222a35;display:flex;flex-direction:column;justify-content:flex-end}.half.neg{justify-content:flex-start;border-top:1px solid #888}#info{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5}#fxBtn,#ambBtn,#musicBtn,#ugBtn,#zoneBtn,#gridBtn{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;padding:4px 8px;cursor:pointer}#ambBtn.on,#musicBtn.on,#ugBtn.on,#zoneBtn.on,#gridBtn.on{background:#3d6fd1}#vol,#ambVol{width:60px}#credit{display:none;position:fixed;right:10px;bottom:10px;color:#ccc;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:6px;font-size:11px;max-width:40vw}#credit a{color:#9cf}#fxMenu{display:none;position:fixed;top:46px;right:80px;background:rgba(10,14,20,.92);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.9;z-index:5}#fxMenu label{display:block;cursor:pointer}#services{position:fixed;bottom:62px;left:0;right:0;margin:0 auto;width:max-content;display:flex;gap:5px;align-items:center;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:10px;color:#ddd;font-size:12px;white-space:nowrap;flex-wrap:wrap;justify-content:center;max-width:96vw;box-sizing:border-box}#services button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer}#services button.on{background:#3d6fd1;border-color:#9cf}#services small{color:#9cf;margin-left:4px}#services button img{width:20px;height:20px;vertical-align:middle;margin-right:4px}#services button{display:flex;align-items:center}#services select{background:#2b3442;color:#fff;border:1px solid #445;border-radius:6px;padding:4px}#budgetBtn{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;padding:4px 8px;cursor:pointer}#nums .neg,.neg{color:#ff7070}.pos{color:#7dff9a}#budget{display:none;position:fixed;z-index:11;top:56px;right:10px;width:330px;max-height:calc(100vh - 190px);overflow:auto;background:rgba(10,14,20,.94);color:#eee;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}#budget h4{margin:8px 0 2px;color:#9cf;font-size:12px}#budget table{width:100%;border-collapse:collapse}#budget td:last-child{text-align:right}#budget tr.tot td{border-top:1px solid #556;font-weight:bold}#budget .sl{display:flex;align-items:center;gap:6px}#budget .sl input{flex:1}#budget button{background:#2b3442;color:#fff;border:1px solid #556;border-radius:6px;padding:4px 8px;cursor:pointer}.bh{display:flex;justify-content:space-between}#toast{position:fixed;z-index:12;top:56px;left:50%;transform:translateX(-50%);background:rgba(160,30,30,.92);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none}#services .sep{margin-left:6px;padding-left:8px;border-left:1px solid #556}#saveBtn,#newBtn{background:#2b3442;color:#fff;border:1px solid #445;border-radius:5px;padding:4px 8px;cursor:pointer}
#newCity{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(#22324a,#0b1018);font-family:system-ui,sans-serif;color:#eee}
#newCity .nc{background:rgba(16,22,32,.95);border:1px solid #34425a;border-radius:14px;padding:22px 26px;width:min(560px,94vw);box-shadow:0 10px 40px #0008}
#newCity h1{margin:0 0 14px;font-size:24px}#newCity label,#newCity .ncRow{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
#newCity .ncRow>span{min-width:80px}#newCity input{background:#1f2836;color:#fff;border:1px solid #445;border-radius:6px;padding:6px 8px;font-size:14px}#newCity #ncName{flex:1}#newCity #ncSeed{width:120px}
#newCity button{background:#2b3442;color:#fff;border:1px solid #445;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}#newCity button.on{background:#3d6fd1;border-color:#9cf}
#ncSize{display:flex;gap:6px}#ncSize button{display:flex;flex-direction:column;align-items:center;min-width:78px}#ncSize small{color:#9cf}
#ncMini{display:block;width:100%;height:auto;margin:8px 0;background:#0b1018;border-radius:8px}
.ncBtns{display:flex;justify-content:space-between;align-items:center;gap:8px}#newCity .go{background:#2f9e55;border-color:#6fd;font-size:15px;padding:8px 16px}
#saveMenu{display:none;position:fixed;z-index:11;top:56px;right:10px;width:380px;max-height:calc(100vh - 190px);overflow:auto;background:rgba(10,14,20,.95);color:#eee;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
#saveMenu h4{margin:10px 0 4px;color:#9cf;font-size:12px}#saveMenu button,.imp{background:#2b3442;color:#fff;border:1px solid #556;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
#saveMenu .sv{display:flex;gap:6px;align-items:center}#saveMenu input#sName{flex:1;background:#1f2836;color:#fff;border:1px solid #445;border-radius:6px;padding:5px 7px}
#saveMenu .slot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-top:1px solid #2a3344}#saveMenu .slot small{color:#aab}#saveMenu .slot span{display:flex;gap:3px}
#saveMenu .chk{display:block;margin-top:6px}#saveMenu .hint{display:block;margin-top:8px;color:#99a}
#ncExtra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:70%}#ncList{display:flex;flex-direction:column;gap:4px;width:100%;max-height:150px;overflow:auto}#ncList button{text-align:left}.imp{display:inline-block}
#ugBtn img{width:18px;height:18px;vertical-align:middle}#toolbar button img{width:20px;height:20px;vertical-align:middle;margin-right:4px}</style></head>

id="fxList"></div></div></div><span id="rci"></span></div><div id="info"></div><div id="budget"></div><div id="saveMenu"></div><div id="toast"></div><div id="hud">Tile: —</div><div id="services"></div><div id="toolbar"></div><div id="credit"></div><div id="help">1–8 pick tool · Esc cancel<br>WASD/arrows pan · wheel or Q/E zoom<br>Drag: pans in Select, builds otherwise<br>Space pause · G grid · Z zones · U underground · 7 power line · 8 pipe · ⚙ effects · click building for info</div><script type="module" src="/src/main.ts"></script></body></html>
